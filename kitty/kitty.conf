include ./theme.conf

# Font configuration
font_family JetBrainsMono Nerd Font Mono
font_size 13.0

# Window appearance
window_padding_width 10
hide_window_decorations yes
background_opacity 0.95

# Other settings
enable_audio_bell no
confirm_os_window_close 0

# Tab bar
tab_bar_style fade
tab_bar_align center
tab_bar_edge top
tab_bar_min_tabs 2
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}: {title}"
tab_bar_margin_height 0.0 0.0
tab_bar_margin_width 0.0
active_tab_font_style bold
inactive_tab_font_style normal

# Tab bar colors (translucent and subtle)
tab_bar_background none
active_tab_foreground   #ffffff
active_tab_background   #404040
inactive_tab_foreground #808080
inactive_tab_background #202020

resize_in_steps yes

# Cursor
cursor_shape beam

# Mouse
mouse_hide_wait 3.0

# URL handling
url_style single

# Performance tuning
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Shell integration
shell_integration enabled

# Keyboard shortcuts
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Herdr owns tabs and panes. Empty Kitty mappings pass these keys through.
map cmd+a
map cmd+n
map cmd+s
map cmd+shift+s
map cmd+d
map cmd+shift+d
map cmd+x
map cmd+w

map cmd+]
map cmd+[
map cmd+shift+]
map cmd+shift+[
map cmd+escape
map cmd+e

map cmd+h
map cmd+j
map cmd+k
map cmd+l
map cmd+left
map cmd+down
map cmd+up
map cmd+right

map cmd+shift+h
map cmd+shift+j
map cmd+shift+k
map cmd+shift+l
map cmd+shift+left
map cmd+shift+right
map cmd+shift+up
map cmd+shift+down

map cmd+1
map cmd+2
map cmd+3
map cmd+4
map cmd+5
map cmd+6
map cmd+7
map cmd+8
map cmd+9
map cmd+0

map cmd+t
map cmd+shift+t

allow_remote_control yes
listen_on unix:/tmp/kitty

