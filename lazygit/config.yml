git:
  diffRenderers:
    - command: delta --dark --paging=never
gui:
  switchTabsWithPanelJumpKeys: true
os:
  editPreset: "nvim"
customCommands:
  - key: 'H'
    context: 'localBranches'
    description: 'Review diff against base branch in tuicr'
    output: terminal
    prompts:
      - type: 'input'
        title: 'Base branch'
        key: 'Base'
        initialValue: 'main'
        suggestions:
          preset: 'branches'
    command: 'tuicr -r {{printf "%s...%s" .Form.Base .SelectedLocalBranch.Name | quote}}'
